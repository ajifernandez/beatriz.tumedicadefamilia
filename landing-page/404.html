    <!-- Critical inline CSS for 404 page -->
    <style>
        :root{--primary-color:#4A6B57;--accent-color:#E8F1EB;--text-color:#2C3E50;--white:#FFFFFF;--font-heading:'Playfair Display',serif;--font-body:'Lato',sans-serif}
        body{font-family:var(--font-body);color:var(--text-color);line-height:1.6;margin:0;background-color:var(--white)}
        .container{max-width:1200px;margin:0 auto;padding:0 2rem}
        .btn{display:inline-block;padding:0.8rem 2rem;border-radius:30px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;transition:all 0.3s ease}
        .btn-primary{background-color:var(--primary-color);color:var(--white);border:2px solid var(--primary-color)}
        .btn-primary:hover{background-color:transparent;color:var(--primary-color)}
        h1,h2{font-family:var(--font-heading);margin-bottom:1rem;color:var(--text-color)}
        .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:4rem 0}
        .error-code{font-size:6rem;font-family:var(--font-heading);color:var(--primary-color);line-height:1;margin:0}
        .error-title{font-size:1.5rem;margin:1rem 0 0.5rem;color:var(--text-color)}
        .error-text{max-width:500px;margin:0 auto 2rem;color:#666}
        .error-links{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-top:1.5rem}
        .btn-outline{color:var(--primary-color);border:2px solid var(--primary-color)}
        .btn-outline:hover{background-color:var(--primary-color);color:var(--white)}
    </style>

                <div class="error-links">

                    <a href="index.html#servicios" class="btn btn-outline" title="Ver servicios médicos">Ver servicios</a>
                    <a href="index.html#contacto" class="btn btn-outline" title="Pedir cita con la Dra. Beatriz">Pedir cita</a>
                </div>
            </div>
        </div>
    </main>
